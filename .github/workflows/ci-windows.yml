name: CI (Windows only)

# Manual-dispatch mirror of the windows-latest leg of ci.yml, for verifying
# Windows before re-enabling the full three-OS matrix. Runs only when triggered
# by hand — no push or pull_request trigger — so it costs nothing until asked.

on:
  workflow_dispatch:
    inputs:
      test_args:
        description: "Extra args appended to `cargo test` (e.g. `-p par-term --lib auto_start_tests`) for isolating a failure"
        type: string
        default: "--workspace"
      test_threads:
        description: "Value for --test-threads (1 serialises the harness, useful for pinning down a crash)"
        type: string
        default: ""
      release_build:
        description: "Also run the release build (slow; the rest of the windows matrix leg)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-windows:
    name: Test - windows-latest
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install Rust toolchain
      # Pinned to the 1.95.0 branch of the action, matching rust-toolchain.toml.
      # To find the SHA: git ls-remote https://github.com/dtolnay/rust-toolchain refs/heads/1.95.0
      uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1
      with:
        toolchain: 1.95.0

    - name: Install ACP bridge
      shell: pwsh
      run: |
        npm install -g @zed-industries/claude-agent-acp
        Get-Command claude-agent-acp

    - name: Python diagnostics
      shell: pwsh
      run: |
        foreach ($n in @('py','python','python3')) {
          $c = Get-Command $n -ErrorAction SilentlyContinue
          if ($c) {
            Write-Host "== $n -> $($c.Source)"
            & $n -c "import sys; print('version:', sys.version.split()[0]); print('exe:', sys.executable)" 2>&1 | Write-Host
            Write-Host "   exit=$LASTEXITCODE"
            & $n -c "import sys; sys.stdout.write('STDOUT_OK\n'); sys.stdout.flush()" 2>&1 | Write-Host
            Write-Host "   stdout-test exit=$LASTEXITCODE"
          } else {
            Write-Host "== $n -> NOT FOUND"
          }
        }

    # Restore and save are split deliberately. `actions/cache` writes the cache
    # in an implicit post-step, which GitHub skips when the job fails — so a
    # streak of red runs never warms the cache and every attempt recompiles
    # from scratch. The matching save steps at the end of this job run with
    # `if: always()`. Key scheme is unchanged.
    - name: Restore cargo registry
      id: cache-registry
      uses: actions/cache/restore@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Restore cargo index
      id: cache-index
      uses: actions/cache/restore@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Restore target directory
      id: cache-target
      uses: actions/cache/restore@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Run tests
      shell: bash
      run: |
        threads=""
        if [ -n "${{ inputs.test_threads }}" ]; then
          threads="-- --test-threads=${{ inputs.test_threads }}"
        fi
        echo "cargo test ${{ inputs.test_args }} $threads"
        cargo test ${{ inputs.test_args }} $threads

    - name: Build release
      if: inputs.release_build
      run: cargo build --release --verbose

    # Save even when the steps above failed. Skipped on an exact key hit, where
    # there is nothing new to write.
    #
    # Cache keys are immutable: the first run to reach this step for a given
    # Cargo.lock wins, and a later, more complete run cannot overwrite it. That
    # is a deliberate trade here. cargo compiles dependencies before workspace
    # crates, so even a run that dies compiling par-term has already cached the
    # expensive, stable part — and the workspace crates change on every
    # iteration of a debugging streak, so they would be rebuilt either way.
    # Versioning the key per run would remove the limitation in general, but it
    # would rewrite a multi-GB target cache on every run and evict the registry
    # caches under the 10GB per-repo limit.
    - name: Save cargo registry
      if: always() && steps.cache-registry.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cargo/registry
        key: ${{ steps.cache-registry.outputs.cache-primary-key }}

    - name: Save cargo index
      if: always() && steps.cache-index.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cargo/git
        key: ${{ steps.cache-index.outputs.cache-primary-key }}

    - name: Save target directory
      if: always() && steps.cache-target.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: target
        key: ${{ steps.cache-target.outputs.cache-primary-key }}
