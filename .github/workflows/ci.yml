name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly full test suite (AUDIT.md ARC-008), 09:17 UTC.
    - cron: '17 9 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Push/PR CI runs formatting, the terminology gate, lint, the no-mux type-check,
# and cargo-deny ONLY — it never runs tests. The full `cargo test --workspace`
# suite runs in two places:
#   - the `nightly-test` job below, on the schedule trigger only (Linux x86_64,
#     macOS ARM64, Windows x86_64), so a regression that local `make checkall`
#     missed surfaces within a day instead of at release time (ARC-008);
#   - the "Release and Deploy" workflow (release.yml) on all five build legs.
# `make doc-check` and `make check-line-counts` remain available locally.
jobs:
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install Rust toolchain
      # Pinned to a stable release tag; update SHA when bumping toolchain version.
      # To find the SHA: git ls-remote https://github.com/dtolnay/rust-toolchain refs/heads/1.99.1
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1
        components: rustfmt, clippy

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libgtk-3-dev libxdo-dev

    - name: Install ACP bridge
      run: make install-acp

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Check terminology
      # UX.md T1-T8 vocabulary gate: python3 only, no build needed.
      run: python3 scripts/check_terminology.py

    - name: Run clippy
      # Two passes: workspace tests/bins at default features (which include
      # `mux`), then the whole workspace with every feature — covers the
      # gated mux wiring and layout conformance in every member crate
      # against the published core >= 0.50 (cards
      # 01a0c723f7b070239ecc5f6fce02f4fc, 01a0c74bfdaf78f0b5b4463033ab5291).
      run: |
        cargo clippy --workspace --all-targets -- -D warnings
        cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Check no-mux build
      # Every other gate builds default features (which include `mux`), so a
      # mux-gated symbol used from ungated code only breaks here.
      run: cargo check --workspace --no-default-features

    - name: Install cargo-deny
      # Pinned: new cargo-deny releases can change the deny.toml schema and
      # break CI without any repo change (bump deliberately with deny.toml).
      run: cargo install cargo-deny --locked --version 0.20.2

    - name: Run cargo-deny
      run: cargo deny check

  nightly-test:
    # Mirrors release.yml's "Run tests" step on three of its five legs.
    name: Nightly tests (${{ matrix.os }})
    if: github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      # Same pinned SHA as the lint job and release.yml.
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.99.1

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libgtk-3-dev libxdo-dev

    - name: Run tests
      run: cargo test --workspace --verbose
