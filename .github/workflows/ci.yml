name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Tests plus the release build take about 27 minutes on a warm Windows
    # runner and longer cold. The original 15 dated from before this job built
    # a release binary, and silently killed every leg mid-build.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install Rust toolchain
      # Pinned to a stable release tag; update SHA when bumping toolchain version.
      # To find the SHA: git ls-remote https://github.com/dtolnay/rust-toolchain refs/heads/master
      uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
      with:
        toolchain: 1.97.1

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libgtk-3-dev libxdo-dev

    - name: Install ACP bridge
      if: runner.os != 'Windows'
      run: make install-acp

    - name: Install ACP bridge (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        npm install -g @zed-industries/claude-agent-acp
        Get-Command claude-agent-acp

    # Restore and save are split deliberately. `actions/cache` writes the cache
    # in an implicit post-step, which GitHub skips when the job fails — so a
    # streak of red runs never warms the cache and every attempt recompiles
    # from scratch. The matching save steps at the end of this job run with
    # `if: always()`. Key scheme is unchanged.
    - name: Restore cargo registry
      id: cache-registry
      uses: actions/cache/restore@v6
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Restore cargo index
      id: cache-index
      uses: actions/cache/restore@v6
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Restore target directory
      id: cache-target
      uses: actions/cache/restore@v6
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Run tests
      run: cargo test --workspace --verbose

    - name: Build release
      run: cargo build --release --verbose

    # Save even when the steps above failed. Skipped on an exact key hit, where
    # there is nothing new to write.
    #
    # Cache keys are immutable: the first run to reach this step for a given
    # Cargo.lock wins, and a later, more complete run cannot overwrite it. That
    # is a deliberate trade here. cargo compiles dependencies before workspace
    # crates, so even a run that dies compiling par-term has already cached the
    # expensive, stable part — and the workspace crates change on every
    # iteration of a debugging streak, so they would be rebuilt either way.
    # Versioning the key per run would remove the limitation in general, but it
    # would rewrite a multi-GB target cache on every run and evict the registry
    # caches under the 10GB per-repo limit.
    - name: Save cargo registry
      if: always() && steps.cache-registry.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cargo/registry
        key: ${{ steps.cache-registry.outputs.cache-primary-key }}

    - name: Save cargo index
      if: always() && steps.cache-index.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cargo/git
        key: ${{ steps.cache-index.outputs.cache-primary-key }}

    - name: Save target directory
      if: always() && steps.cache-target.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: target
        key: ${{ steps.cache-target.outputs.cache-primary-key }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install Rust toolchain
      # Pinned to a stable release tag; update SHA when bumping toolchain version.
      # To find the SHA: git ls-remote https://github.com/dtolnay/rust-toolchain refs/heads/master
      uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
      with:
        toolchain: 1.97.1
        components: rustfmt, clippy

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libgtk-3-dev libxdo-dev

    - name: Install ACP bridge
      run: make install-acp

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Install cargo-deny
      # Pinned: new cargo-deny releases can change the deny.toml schema and
      # break CI without any repo change (bump deliberately with deny.toml).
      run: cargo install cargo-deny --locked --version 0.19.9

    - name: Run cargo-deny
      run: cargo deny check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    # Catches the two failure modes a reviewer cannot see in a diff: a relative
    # path that no longer resolves after a doc moves, and a `#anchor` whose
    # heading was renamed. Every flag lives in lychee.toml so `make doc-check`
    # runs exactly this check locally.
    #
    # It will NOT catch a link whose target happens to exist but is the wrong
    # file — `../README.md` from docs/features/ resolves to docs/README.md, not
    # the root README. Those still need a human.
    - name: Check documentation links
      # Pinned to the v2.9.0 commit; bump deliberately, since a new lychee
      # release can add checks that turn CI red with no repo change.
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
      with:
        # The inner single quotes are load-bearing: the action `eval`s this
        # string, so an unquoted glob is expanded by bash instead of lychee.
        # Bash without `globstar` treats `**` as `*`, which silently narrows
        # the run to one directory level and skips docs/features, docs/guides,
        # and every root-level Markdown file.
        args: "'./**/*.md'"
        fail: true

  line-counts:
    name: File size
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7

    # Enforces the file-size policy CLAUDE.md states but nothing checked: warn
    # over 500 production lines, fail over 800. This replaces five hand-written
    # `ARC-009` line-count comments that had every one drifted below the real
    # count, so the early warning they were meant to give never fired.
    #
    # `make check-line-counts` runs exactly this, and the ubuntu image ships
    # python3, so no setup step is needed.
    - name: Check production file line counts
      run: make check-line-counts
