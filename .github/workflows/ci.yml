name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Push/PR CI runs formatting and lint ONLY. The full `cargo test --workspace`
# suite runs in the "Release and Deploy" workflow (release.yml) on all five
# build legs — Linux x86_64/ARM64, macOS x86_64/ARM64, Windows x86_64 — so
# re-running it here across three OSes is redundant compute. `make doc-check`
# and `make check-line-counts` remain available locally. Add a test job back
# here only if you want pre-merge coverage independent of a release.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install Rust toolchain
      # Pinned to a stable release tag; update SHA when bumping toolchain version.
      # To find the SHA: git ls-remote https://github.com/dtolnay/rust-toolchain refs/heads/master
      uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
      with:
        toolchain: 1.97.1
        components: rustfmt, clippy

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libasound2-dev libgtk-3-dev libxdo-dev

    - name: Install ACP bridge
      run: make install-acp

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Install cargo-deny
      # Pinned: new cargo-deny releases can change the deny.toml schema and
      # break CI without any repo change (bump deliberately with deny.toml).
      run: cargo install cargo-deny --locked --version 0.19.9

    - name: Run cargo-deny
      run: cargo deny check
