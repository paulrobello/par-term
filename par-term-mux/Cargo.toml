[package]
name = "par-term-mux"
version = "0.7.0"
edition = "2024"
rust-version = "1.100"
authors = ["Paul Robello <probello@gmail.com>"]
description = "par-mux control-mode client for par-term terminal emulator"
license = "MIT"
repository = "https://github.com/paulrobello/par-term"
keywords = ["terminal", "mux", "control-mode", "multiplexer"]
categories = ["command-line-utilities"]

[dependencies]
# Sync layer, parser bridge, types, and key translation — reused in place.
# Optional: only the mux-gated modules reference it (the crate body is
# #![cfg(feature = "mux")], so a default-features build would otherwise
# carry an unused dependency through packaging).
par-term-tmux = { path = "../par-term-tmux", version = "0.3.2", optional = true }

# Terminal emulator core (MuxClient transport)
par-term-emu-core-rust = { workspace = true, optional = true }

# Logging
log = { workspace = true, optional = true }

# Roster reason tokens arrive as reason=<standard base64> (ARC-060 grammar)
base64 = { workspace = true, optional = true }

[features]
# Client for the core's par-mux daemon (core >= 0.50 ships the `mux`
# feature; the pin was raised in card 01a0d1cbc649).
mux = [
    "dep:par-term-tmux",
    "dep:par-term-emu-core-rust",
    "dep:log",
    "dep:base64",
    "par-term-emu-core-rust/mux",
]
