[package]
name = "par-term-tmux"
version = "0.1.15"
edition = "2024"
rust-version = "1.98"
authors = ["Paul Robello <probello@gmail.com>"]
description = "tmux control mode integration for par-term terminal emulator"
license = "MIT"
repository = "https://github.com/paulrobello/par-term"
homepage = "https://github.com/paulrobello/par-term"
keywords = ["terminal", "tmux", "control-mode", "multiplexer"]
categories = ["command-line-utilities"]

[dependencies]
# Configuration (PaneId, TabId)
par-term-config = { path = "../par-term-config", version = "0.14.4" }

# Terminal emulator core (tmux control mode parser)
par-term-emu-core-rust.workspace = true

# Window event types for prefix key handling
winit.workspace = true

# Date/time for status format
chrono.workspace = true

# Regex for sanitizing tmux output
regex.workspace = true

# Cross-platform hostname detection
hostname.workspace = true

# Logging
log.workspace = true

[dev-dependencies]

[features]
# Conformance test against the core's mux layout emitter
# (tests/layout_conformance.rs). Declared empty here: forwarding the core's
# `mux` feature (core >= 0.50 only, unpublished) breaks cargo resolution
# against crates.io 0.49 even with this feature disabled — cargo validates
# [features] dep-forwarding eagerly. Run via scripts/with-local-core.sh
# (or make with-local-core), which extends this locally to
# ["par-term-emu-core-rust/mux"] and auto-reverts on exit.
layout-conformance = ["par-term-emu-core-rust/mux"]
